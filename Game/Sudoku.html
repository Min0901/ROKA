<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모던 스도쿠 (Sudoku)</title>
    <style>
        /* [디자인 및 CSS] */
        :root {
            --bg-color: #ffffff;
            --text-color: #344861; /* 기본 숫자 색상 (주어진 힌트) */
            --user-color: #0072e3; /* 사용자가 입력한 정답 색상 */
            --error-color: #e55c6c; /* 오답 텍스트 색상 */
            --error-bg: #f7cfd6; /* 오답 배경색 */
            --grid-border-heavy: #344861; /* 3x3 구역 굵은 테두리 */
            --grid-border-light: #c6d2df; /* 일반 셀 얇은 테두리 */
            --selected-bg: #bbdefb; /* 선택된 셀 배경 */
            --related-bg: #e2ebf3; /* 같은 행/열/박스 배경 */
            --same-num-bg: #c3d7ea; /* 동일한 숫자 하이라이트 배경 */
            --btn-bg: #f3f6fa;
            --btn-hover: #e2ebf3;
            --note-color: #777777;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none; /* 드래그 방지 */
        }

        header {
            margin: 20px 0;
            text-align: center;
        }

        h1 {
            margin: 0 0 15px 0;
            font-size: 2rem;
            color: var(--text-color);
        }

        /* 난이도 선택 버튼들 */
        .difficulty-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .difficulty-selector button {
            background: none;
            border: none;
            font-size: 1rem;
            color: var(--text-color);
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 20px;
            transition: background-color 0.2s;
        }

        .difficulty-selector button.active {
            background-color: var(--text-color);
            color: #fff;
            font-weight: bold;
        }

        /* 상태바 (실수 카운트, 새 게임 등) */
        .status-bar {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 1rem;
        }

        .mistakes {
            color: var(--text-color);
        }
        
        .mistakes span {
            color: var(--error-color);
        }

        /* 스도쿠 보드 */
        .board-container {
            width: 100%;
            max-width: 450px;
            aspect-ratio: 1 / 1;
            border: 2px solid var(--grid-border-heavy);
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            box-sizing: border-box;
            background-color: var(--grid-border-heavy); /* 테두리 사이의 색상을 채우기 위해 */
            gap: 1px; /* 얇은 테두리 역할 */
        }

        .cell {
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            cursor: pointer;
            position: relative;
            transition: background-color 0.1s;
        }

        /* 3x3 박스를 위한 굵은 테두리 처리 */
        .cell:nth-child(3n) { border-right: 2px solid var(--grid-border-heavy); }
        .cell:nth-child(9n) { border-right: none; }
        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid var(--grid-border-heavy); }

        /* 하이라이트 클래스들 */
        .cell.related { background-color: var(--related-bg); }
        .cell.same-number { background-color: var(--same-num-bg); }
        .cell.selected { background-color: var(--selected-bg); }

        /* 숫자 스타일 */
        .cell.given { font-weight: 700; color: var(--text-color); }
        .cell.user { font-weight: 400; color: var(--user-color); font-size: 2rem;}
        .cell.error { color: var(--error-color); background-color: var(--error-bg) !important; font-weight: 400; }

        /* 메모(Notes) 그리드 */
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            pointer-events: none; /* 클릭은 부모 셀이 받도록 */
        }

        .note-item {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.7rem;
            color: var(--note-color);
            font-weight: 400;
        }

        /* 하단 컨트롤 영역 */
        .controls {
            display: flex;
            width: 100%;
            max-width: 450px;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .control-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            color: var(--text-color);
        }

        .control-btn .icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--btn-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            margin-bottom: 5px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        
        .control-btn:hover .icon { background-color: var(--btn-hover); }
        .control-btn.active .icon { background-color: var(--text-color); color: #fff; }

        /* 숫자 패드 */
        .numpad {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 5px;
            width: 100%;
            max-width: 450px;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .num-btn {
            background-color: var(--btn-bg);
            color: var(--user-color);
            border: none;
            border-radius: 8px;
            font-size: 1.8rem;
            padding: 15px 0;
            cursor: pointer;
            transition: background-color 0.2s;
            font-weight: 400;
        }

        .num-btn:hover { background-color: var(--btn-hover); }

        /* 모달 오버레이 (게임오버 / 클리어) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal {
            background: #fff;
            padding: 30px 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .modal h2 { margin-top: 0; color: var(--text-color); }
        .modal button {
            background-color: var(--user-color);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
        .modal button:hover { background-color: #005bb5; }

        @media (max-width: 500px) {
            .cell { font-size: 1.4rem; }
            .num-btn { font-size: 1.4rem; padding: 10px 0; }
            .board-container, .status-bar, .controls, .numpad { max-width: 95%; }
            .note-item { font-size: 0.55rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Sudoku</h1>
        <div class="difficulty-selector" id="difficulty-selector">
            <button data-diff="Easy" class="active">쉬움(Easy)</button>
            <button data-diff="Medium">보통(Medium)</button>
            <button data-diff="Hard">어려움(Hard)</button>
            <button data-diff="Expert">전문가(Expert)</button>
        </div>
    </header>

    <div class="status-bar">
        <div class="mistakes">Mistakes: <span id="mistake-count">0/3</span></div>
        <button style="background: none; border:none; color:var(--user-color); font-weight:bold; cursor:pointer; font-size:1rem;" onclick="startNewGame()">New Game</button>
    </div>

    <div class="board-container" id="board">
        </div>

    <div class="controls">
        <button class="control-btn" onclick="handleErase()">
            <div class="icon">⌫</div>
            <span>Erase</span>
        </button>
        <button class="control-btn" id="notes-btn" onclick="toggleNotes()">
            <div class="icon">✎</div>
            <span>Notes <span id="notes-status" style="font-size: 0.7rem; font-weight: normal;">OFF</span></span>
        </button>
    </div>

    <div class="numpad" id="numpad">
        </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2 id="modal-title">메시지</h2>
            <p id="modal-desc">설명</p>
            <button onclick="startNewGame()">새 게임(New Game)</button>
        </div>
    </div>

<script>
    /* =====================================================================
       [전역 상태 및 변수 선언]
       로컬 상태로 모든 게임 데이터(보드, 정답, 사용자 입력, 메모 등)를 관리합니다.
    ====================================================================== */
    const BOARD_SIZE = 9;
    const MAX_MISTAKES = 3;
    
    // 게임 데이터 객체들
    let solution = [];     // 정답 보드 (완성된 상태)
    let initialBoard = []; // 초기 퍼즐 상태 (0은 빈칸)
    let currentBoard = []; // 사용자가 입력 중인 보드 (오답 포함)
    let notes = [];        // 메모(후보 숫자) 상태. Set 객체를 담은 2차원 배열

    // UI 상태
    let selectedCell = null; // {r, c} 객체
    let mistakes = 0;
    let notesMode = false;
    let currentDifficulty = 'Easy';
    let gameOver = false;

    // DOM 요소 캐싱
    const boardEl = document.getElementById('board');
    const numpadEl = document.getElementById('numpad');
    const mistakeCountEl = document.getElementById('mistake-count');
    const diffButtons = document.querySelectorAll('.difficulty-selector button');
    const modalOverlay = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const notesBtn = document.getElementById('notes-btn');
    const notesStatus = document.getElementById('notes-status');

    /* =====================================================================
       [초기화 및 UI 렌더링 함수]
    ====================================================================== */
    
    // 앱 초기 실행
    function init() {
        // 숫자 패드 렌더링
        for (let i = 1; i <= 9; i++) {
            const btn = document.createElement('button');
            btn.className = 'num-btn';
            btn.innerText = i;
            btn.onclick = () => handleInput(i);
            numpadEl.appendChild(btn);
        }

        // 난이도 버튼 이벤트 바인딩
        diffButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                diffButtons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentDifficulty = e.target.getAttribute('data-diff');
                startNewGame();
            });
        });

        // 키보드 이벤트 바인딩
        document.addEventListener('keydown', handleKeyboard);

        startNewGame();
    }

    // 새 게임 시작: 상태 초기화 및 퍼즐 생성
    function startNewGame() {
        modalOverlay.style.display = 'none';
        mistakes = 0;
        gameOver = false;
        selectedCell = null;
        updateMistakesUI();

        // 난이도별 남길 단서(Clues) 개수 설정
        let cluesCount = 40; // Default: Easy
        if (currentDifficulty === 'Medium') cluesCount = 32;
        if (currentDifficulty === 'Hard') cluesCount = 27;
        if (currentDifficulty === 'Expert') cluesCount = 22;

        // 스도쿠 퍼즐 생성
        const puzzle = generateSudoku(cluesCount);
        solution = puzzle.solution;
        initialBoard = puzzle.board.map(r => [...r]);
        currentBoard = puzzle.board.map(r => [...r]);
        
        // 메모 배열 초기화 (각 칸마다 Set을 가짐)
        notes = Array.from({length: BOARD_SIZE}, () => 
            Array.from({length: BOARD_SIZE}, () => new Set())
        );

        createBoardDOM();
        updateUI();
    }

    // 빈 9x9 HTML 그리드 생성
    function createBoardDOM() {
        boardEl.innerHTML = '';
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${r}-${c}`;
                cell.onclick = () => handleCellClick(r, c);
                boardEl.appendChild(cell);
            }
        }
    }

    /* =====================================================================
       [UI 업데이트 및 상호작용 로직]
    ====================================================================== */

    // 셀 클릭 처리
    function handleCellClick(r, c) {
        if (gameOver) return;
        selectedCell = { r, c };
        updateUI();
    }

    // 화면의 클래스와 값들을 현재 상태에 맞게 전면 업데이트
    function updateUI() {
        let selectedValue = null;
        if (selectedCell && currentBoard[selectedCell.r][selectedCell.c] !== 0) {
            selectedValue = currentBoard[selectedCell.r][selectedCell.c];
        }

        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                const cell = document.getElementById(`cell-${r}-${c}`);
                cell.className = 'cell'; // 클래스 초기화
                cell.innerHTML = ''; // 내부 내용 초기화

                const val = currentBoard[r][c];

                // 1. 값 또는 메모 렌더링
                if (val !== 0) {
                    cell.innerText = val;
                    // 스타일 지정
                    if (initialBoard[r][c] !== 0) {
                        cell.classList.add('given');
                    } else if (val !== solution[r][c]) {
                        cell.classList.add('error');
                    } else {
                        cell.classList.add('user');
                    }
                } else {
                    // 메모 렌더링
                    if (notes[r][c].size > 0) {
                        const notesGrid = document.createElement('div');
                        notesGrid.className = 'notes-grid';
                        for (let n = 1; n <= 9; n++) {
                            const noteItem = document.createElement('div');
                            noteItem.className = 'note-item';
                            if (notes[r][c].has(n)) {
                                noteItem.innerText = n;
                            }
                            notesGrid.appendChild(noteItem);
                        }
                        cell.appendChild(notesGrid);
                    }
                }

                // 2. 하이라이트 클래스 적용
                if (selectedCell) {
                    // 현재 선택된 셀과 관련된 셀들 (같은 행, 열, 3x3 박스)
                    const isSameRow = (r === selectedCell.r);
                    const isSameCol = (c === selectedCell.c);
                    const isSameBox = (Math.floor(r / 3) === Math.floor(selectedCell.r / 3) && 
                                       Math.floor(c / 3) === Math.floor(selectedCell.c / 3));

                    if (r === selectedCell.r && c === selectedCell.c) {
                        cell.classList.add('selected'); // 선택된 셀 자체
                    } else if (isSameRow || isSameCol || isSameBox) {
                        cell.classList.add('related'); // 관련된 구역 연하게
                    }

                    // 같은 숫자가 보드에 있으면 하이라이트
                    if (selectedValue && val === selectedValue && (r !== selectedCell.r || c !== selectedCell.c)) {
                        cell.classList.add('same-number');
                    }
                }
            }
        }
    }

    // 숫자 입력 (키보드 또는 버튼)
    function handleInput(num) {
        if (gameOver || !selectedCell) return;
        const {r, c} = selectedCell;

        // 수정할 수 없는 초기 힌트 셀인 경우 무시
        if (initialBoard[r][c] !== 0) return;

        if (notesMode) {
            // 메모 모드: 현재 셀이 비어있거나, 이미 입력된 정답을 지울때만 동작
            if (currentBoard[r][c] === 0) {
                if (notes[r][c].has(num)) {
                    notes[r][c].delete(num);
                } else {
                    notes[r][c].add(num);
                }
            }
        } else {
            // 입력 모드
            // 이미 정답이 적혀있는 경우 무시
            if (currentBoard[r][c] === solution[r][c]) return;
            
            // 입력된 값이 정답인지 확인
            if (num === solution[r][c]) {
                currentBoard[r][c] = num;
                // 정답을 맞췄으므로 관련된 구역의 메모에서 해당 숫자를 지움
                clearNotesInRelatedCells(r, c, num);
                checkWinCondition();
            } else {
                // 오답인 경우
                currentBoard[r][c] = num; // 오답을 셀에 표시하여 사용자가 보게 함
                addMistake();
            }
        }
        updateUI();
    }

    // 지우기 기능
    function handleErase() {
        if (gameOver || !selectedCell) return;
        const {r, c} = selectedCell;
        
        // 힌트로 주어진 숫자는 지울 수 없음
        if (initialBoard[r][c] !== 0) return;

        // 정답을 이미 맞춰버린 셀은 지울 수 없음 (Sudoku.com 규칙)
        if (currentBoard[r][c] === solution[r][c]) return;

        // 오답이나 메모 삭제
        currentBoard[r][c] = 0;
        notes[r][c].clear();
        updateUI();
    }

    // 메모 모드 토글
    function toggleNotes() {
        if(gameOver) return;
        notesMode = !notesMode;
        if (notesMode) {
            notesBtn.classList.add('active');
            notesStatus.innerText = 'ON';
        } else {
            notesBtn.classList.remove('active');
            notesStatus.innerText = 'OFF';
        }
    }

    // 키보드 상호작용
    function handleKeyboard(e) {
        if (gameOver) return;
        
        // 숫자 1~9 입력
        if (e.key >= '1' && e.key <= '9') {
            handleInput(parseInt(e.key));
        } 
        // 지우기
        else if (e.key === 'Backspace' || e.key === 'Delete') {
            handleErase();
        } 
        // 메모 모드 단축키
        else if (e.key.toLowerCase() === 'n') {
            toggleNotes();
        } 
        // 방향키 이동
        else if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
            e.preventDefault();
            if (!selectedCell) {
                selectedCell = {r: 4, c: 4}; // 초기 선택이 없으면 정중앙부터 시작
            } else {
                let {r, c} = selectedCell;
                if (e.key === 'ArrowUp') r = (r - 1 + BOARD_SIZE) % BOARD_SIZE;
                if (e.key === 'ArrowDown') r = (r + 1) % BOARD_SIZE;
                if (e.key === 'ArrowLeft') c = (c - 1 + BOARD_SIZE) % BOARD_SIZE;
                if (e.key === 'ArrowRight') c = (c + 1) % BOARD_SIZE;
                selectedCell = {r, c};
            }
            updateUI();
        }
    }

    // 관련 셀(행, 열, 박스)의 메모에서 특정 숫자를 지움
    function clearNotesInRelatedCells(r, c, num) {
        const boxStartR = Math.floor(r / 3) * 3;
        const boxStartC = Math.floor(c / 3) * 3;

        for (let i = 0; i < BOARD_SIZE; i++) {
            // 행과 열 지우기
            notes[r][i].delete(num);
            notes[i][c].delete(num);
            
            // 3x3 박스 지우기
            const rIdx = boxStartR + Math.floor(i / 3);
            const cIdx = boxStartC + (i % 3);
            notes[rIdx][cIdx].delete(num);
        }
    }

    // 실수 추가 처리
    function addMistake() {
        mistakes++;
        updateMistakesUI();
        if (mistakes >= MAX_MISTAKES) {
            showModal("게임 오버", "3회 이상 실수하셨습니다. 새 게임을 시작해보세요.");
        }
    }

    // 실수 카운터 텍스트 업데이트
    function updateMistakesUI() {
        mistakeCountEl.innerText = `${mistakes}/${MAX_MISTAKES}`;
    }

    // 승리 조건 체크
    function checkWinCondition() {
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                if (currentBoard[r][c] !== solution[r][c]) return; // 하나라도 안맞으면 패스
            }
        }
        showModal("축하합니다!", "퍼즐을 성공적으로 완성하셨습니다!");
    }

    function showModal(title, desc) {
        gameOver = true;
        modalTitle.innerText = title;
        modalDesc.innerText = desc;
        modalOverlay.style.display = 'flex';
    }


    /* =====================================================================
       [스도쿠 퍼즐 생성 알고리즘]
       백트래킹을 활용하여 무작위의 유일한 해(Unique Solution)를 가지는 퍼즐을 생성합니다.
    ====================================================================== */

    function generateSudoku(targetClues) {
        // 1. 빈 9x9 보드 생성
        let board = Array.from({length: BOARD_SIZE}, () => Array(BOARD_SIZE).fill(0));
        
        // 2. 대각선 3x3 박스 3개를 랜덤으로 채움 (서로 독립적이므로 빠름)
        for (let i = 0; i < BOARD_SIZE; i += 3) {
            fillDiagonalBox(board, i, i);
        }

        // 3. 나머지 칸을 백트래킹으로 풀어서 완전한 정답(solution) 보드 생성
        solveSudoku(board);
        const solutionBoard = board.map(row => [...row]);

        // 4. 숫자를 지워나가면서 문제(puzzle) 생성
        // 무작위로 81개의 위치 생성
        let positions = [];
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                positions.push({r, c});
            }
        }
        // 위치를 무작위로 섞음 (Fisher-Yates Shuffle)
        for (let i = positions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [positions[i], positions[j]] = [positions[j], positions[i]];
        }

        let cluesLeft = 81;
        
        // 섞인 위치를 순회하며 숫자 제거 시도
        for (let i = 0; i < positions.length; i++) {
            if (cluesLeft <= targetClues) break; // 목표 난이도 단서 개수 도달 시 중단

            const {r, c} = positions[i];
            const temp = board[r][c];
            
            if (temp === 0) continue;

            board[r][c] = 0; // 숫자 임시 제거
            
            // 숫자를 제거한 보드의 해(Solution)가 1개(유일해)인지 검증
            // (Javascript 브라우저 환경에서 너무 느려지지 않도록 카운트 백트래킹 활용)
            let boardCopy = board.map(row => [...row]);
            if (countSolutions(boardCopy) !== 1) {
                // 해가 여러개로 늘어나면(유일하지 않으면), 뺐던 숫자를 다시 돌려놓음
                board[r][c] = temp;
            } else {
                cluesLeft--; // 유일해가 유지되면 성공적으로 단서 하나 제거
            }
        }

        return {
            board: board,
            solution: solutionBoard
        };
    }

    // 특정 3x3 박스에 1~9 숫자를 무작위로 채워넣음
    function fillDiagonalBox(board, rowStart, colStart) {
        let numList = [1, 2, 3, 4, 5, 6, 7, 8, 9];
        // 리스트 셔플
        for (let i = numList.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [numList[i], numList[j]] = [numList[j], numList[i]];
        }

        let index = 0;
        for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) {
                board[rowStart + i][colStart + j] = numList[index];
                index++;
            }
        }
    }

    // 기본 스도쿠 해결 알고리즘 (백트래킹) - 첫 번째로 찾은 해를 반환
    function solveSudoku(board) {
        let empty = findEmptyCell(board);
        if (!empty) return true; // 다 채워졌음

        let [r, c] = empty;
        for (let num = 1; num <= 9; num++) {
            if (isSafe(board, r, c, num)) {
                board[r][c] = num;
                if (solveSudoku(board)) return true;
                board[r][c] = 0; // 복구(백트래킹)
            }
        }
        return false;
    }

    // 주어진 보드의 가능한 해(Solution)의 개수를 셈 (유일해 검증용)
    // 2개 이상을 찾으면 즉시 종료하여 성능 최적화
    function countSolutions(board) {
        let empty = findEmptyCell(board);
        if (!empty) return 1;

        let [r, c] = empty;
        let count = 0;

        for (let num = 1; num <= 9; num++) {
            if (isSafe(board, r, c, num)) {
                board[r][c] = num;
                count += countSolutions(board);
                board[r][c] = 0;
                
                // 해가 2개 이상 발견되면 더 찾을 필요 없이 조기 반환 (빠른 처리)
                if (count > 1) return count;
            }
        }
        return count;
    }

    // 비어있는(0) 셀 좌표 반환
    function findEmptyCell(board) {
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                if (board[r][c] === 0) return [r, c];
            }
        }
        return null;
    }

    // 특정 숫자를 (r, c)에 넣을 수 있는지 스도쿠 규칙 검사
    function isSafe(board, r, c, num) {
        // 1. 행 검사
        for (let i = 0; i < BOARD_SIZE; i++) {
            if (board[r][i] === num) return false;
        }
        // 2. 열 검사
        for (let i = 0; i < BOARD_SIZE; i++) {
            if (board[i][c] === num) return false;
        }
        // 3. 3x3 박스 검사
        const boxStartR = Math.floor(r / 3) * 3;
        const boxStartC = Math.floor(c / 3) * 3;
        for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) {
                if (board[boxStartR + i][boxStartC + j] === num) return false;
            }
        }
        return true;
    }

    // 브라우저 렌더링 완료 후 게임 초기화
    window.onload = init;
</script>
